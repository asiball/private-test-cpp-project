# rustfmt 設定 (cargo fmt の動作を制御)
#
# 相当ツール (C++ 側): clang-format
#
# 注意: stable ツールチェーン (CI は dtolnay/rust-toolchain@stable) で
#       有効なオプションのみ使用する。imports_granularity / group_imports /
#       trailing_comma / wrap_comments / normalize_comments などは nightly 専用で、
#       stable では「Warning: can't set ...」とともに無視されるため設定しない
#       (use のグループ化などの慣習はコードレビューで担保する)。
#
# 主な選択基準:
#   - max_width=100: 組み込みコードは C++ と同様に 100 列が読みやすい

edition = "2021"
max_width = 100

# スタイル
use_small_heuristics = "Default"
newline_style = "Unix"
