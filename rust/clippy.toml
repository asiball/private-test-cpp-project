# Clippy 設定 (cargo clippy の動作を制御)
#
# 相当ツール (C++ 側): cppcheck + clang-tidy
#
# ここでは lint の有効/無効の "しきい値" のみ設定する。
# lint グループの選択は Cargo.toml の [workspace.lints.clippy] で行う。
#
# 注意: しきい値は対応する lint が有効なグループにあるときだけ意味を持つ。
#       cognitive-complexity (nursery) / too-many-lines (pedantic) は
#       [workspace.lints.clippy] で有効化していないため設定しない。

# 型の複雑度上限 (デフォルト 250) — clippy::type_complexity (complexity グループ)
type-complexity-threshold = 200

# 関数引数の上限 (デフォルト 7) — clippy::too_many_arguments (complexity グループ)
too-many-arguments-threshold = 6
