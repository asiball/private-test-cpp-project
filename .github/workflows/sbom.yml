name: SBOM

# Trigger on:
#   - Release tags: regenerate and attach SBOM to the GitHub Release
#   - Push to main (metadata or CMakeLists.txt changed): regenerate if stale
#   - Pull requests: verify SBOM is consistent with metadata (no auto-commit)
#   - Manual dispatch: always regenerate

on:
  # NOTE: push トリガで tags と paths を同居させると、paths フィルタがタグ push に
  #       適用されてメタデータ未変更のリリースタグでは update-sbom が起動しない
  #       （= リリースへの SBOM 添付が漏れる）。GitHub Actions は push を 2 つに
  #       分けられないため、ここでは paths を外してタグを確実に起動させる。
  #       main への通常 push でも起動するが、SBOM に差分が無ければコミットしない
  #       （冪等）ため無害。
  push:
    tags:
      - 'spi-hal/v*'
      - 'i2c-hal/v*'
      - 'gpio/v*'
      - 'libsensor/v*'
      - 'libadxl345/v*'
      - 'cli/v*'
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'tools/sbom-metadata.json'
      - '**/CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── PR: verify only (no commit) ──────────────────────────────────────────────
  verify-sbom:
    name: Verify SBOM consistency
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check SBOM matches metadata
        run: python3 tools/generate-sbom.py --verify

  # ── push / tag / manual: regenerate and commit ───────────────────────────────
  update-sbom:
    name: Regenerate SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # タグ push では detached HEAD のため、main へコミット/push する前に main を
      # 明示チェックアウトする（HEAD:main への push が non-fast-forward で失敗するのを防ぐ）。
      # SBOM はメタデータから生成され git 履歴に依存しないため、生成前に切り替えてよい。
      - name: Check out main
        run: |
          git fetch origin main
          git checkout main

      - name: Generate SBOM
        run: python3 tools/generate-sbom.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sbom.spdx sbom.cdx.json
          git diff --cached --quiet && echo "SBOM unchanged" || \
            (git commit -m "chore: regenerate SBOM [skip ci]" && \
             git push origin HEAD:main)

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx
            sbom.cdx.json

      - name: Attach SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.spdx
            sbom.cdx.json
