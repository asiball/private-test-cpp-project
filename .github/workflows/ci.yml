name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe でタグを取得するため全履歴が必要

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make git libgtest-dev gcovr

      # GTest はソースからビルドして /usr/local に install する（落とし穴 #3）。
      # ビルド成果物 /tmp/gtest-build をキャッシュし、キャッシュヒット時は
      # ビルド（高コスト）を省略して install のみ実行する。
      # キャッシュキーは libgtest-dev のバージョンに紐付け、apt 側が更新されたら自動失効させる。
      - name: GTest cache key
        id: gtest-key
        run: echo "ver=$(dpkg-query -W -f='${Version}' libgtest-dev)" >> "$GITHUB_OUTPUT"

      - name: Cache GTest build
        id: cache-gtest
        uses: actions/cache@v4
        with:
          path: /tmp/gtest-build
          key: gtest-${{ runner.os }}-${{ steps.gtest-key.outputs.ver }}

      - name: Build GTest from source
        if: steps.cache-gtest.outputs.cache-hit != 'true'
        run: |
          cmake -B /tmp/gtest-build /usr/src/googletest \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/gtest-build

      - name: Install GTest
        run: sudo cmake --install /tmp/gtest-build --prefix /usr/local

      - name: CMake Release build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: SPI HAL unit tests
        run: |
          cmake -S spi-hal -B build/spihal-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/spihal-debug -j$(nproc)
          sudo cmake --install build/spihal-debug --prefix /usr/local
          cmake -S tests/unit/spi-hal -B build/test-spihal \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-I${{ github.workspace }}/spi-hal/include"
          cmake --build build/test-spihal -j$(nproc)
          mkdir -p test-results
          ./build/test-spihal/test_spi_driver \
            --gtest_output=xml:test-results/spihal-unit.xml
          ./build/test-spihal/test_kernel_spi_driver \
            --gtest_output=xml:test-results/spihal-kernel-unit.xml

      - name: I2C HAL unit tests
        run: |
          cmake -S i2c-hal -B build/i2chal-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/i2chal-debug -j$(nproc)
          sudo cmake --install build/i2chal-debug --prefix /usr/local
          cmake -S tests/unit/i2c-hal -B build/test-i2chal \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-I${{ github.workspace }}/i2c-hal/include"
          cmake --build build/test-i2chal -j$(nproc)
          mkdir -p test-results
          ./build/test-i2chal/test_i2c_driver \
            --gtest_output=xml:test-results/i2chal-unit.xml

      - name: GPIO unit tests
        run: |
          cmake -S gpio -B build/gpio-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/gpio-debug -j$(nproc)
          sudo cmake --install build/gpio-debug --prefix /usr/local
          cmake -S tests/unit/gpio -B build/test-gpio \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-I${{ github.workspace }}/gpio/include"
          cmake --build build/test-gpio -j$(nproc)
          ./build/test-gpio/test_gpio_line \
            --gtest_output=xml:test-results/gpio-unit.xml

      - name: Libsensor unit tests (MCP3008 + ADS1115)
        run: |
          cmake -S libsensor -B build/libsensor-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/libsensor-debug -j$(nproc)
          sudo cmake --install build/libsensor-debug --prefix /usr/local
          sudo ldconfig
          cmake -S tests/unit/libsensor -B build/test-libsensor \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-I${{ github.workspace }}/libsensor/include -I${{ github.workspace }}/i2c-hal/include -I${{ github.workspace }}/tests/mocks"
          cmake --build build/test-libsensor -j$(nproc)
          ./build/test-libsensor/test_sensor \
            --gtest_output=xml:test-results/libsensor-unit.xml
          ./build/test-libsensor/test_ads1115 \
            --gtest_output=xml:test-results/ads1115-unit.xml

      - name: Libadxl345 unit tests
        run: |
          cmake -S libadxl345 -B build/libadxl345-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/libadxl345-debug -j$(nproc)
          sudo cmake --install build/libadxl345-debug --prefix /usr/local
          sudo ldconfig
          cmake -S tests/unit/libadxl345 -B build/test-libadxl345 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-I${{ github.workspace }}/libadxl345/include -I${{ github.workspace }}/tests/mocks"
          cmake --build build/test-libadxl345 -j$(nproc)
          ./build/test-libadxl345/test_adxl345 \
            --gtest_output=xml:test-results/libadxl345-unit.xml

      - name: Libmcp9808 unit tests
        run: |
          cmake -S libmcp9808 -B build/libmcp9808-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/libmcp9808-debug -j$(nproc)
          sudo cmake --install build/libmcp9808-debug --prefix /usr/local
          sudo ldconfig
          # mcp9808.hpp は ii2c_driver.hpp を単純名 include するため i2c-hal/include が必須
          cmake -S tests/unit/libmcp9808 -B build/test-libmcp9808 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-I${{ github.workspace }}/libmcp9808/include -I${{ github.workspace }}/i2c-hal/include -I${{ github.workspace }}/tests/mocks"
          cmake --build build/test-libmcp9808 -j$(nproc)
          ./build/test-libmcp9808/test_mcp9808 \
            --gtest_output=xml:test-results/libmcp9808-unit.xml

      - name: Integration tests (compile + skip check)
        run: |
          # 結合テストは libsensor(sensor/ads1115) / libadxl345 / gpio を install 済みの
          # 名前でリンクする。これらは上の各単体テストステップで既に install 済み。
          # 実機が無い CI では全テストが GTEST_SKIP される（compile + skip 確認）。
          sudo ldconfig
          cmake -S tests/integration -B build/test-integration \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-I${{ github.workspace }}/libsensor/include -I${{ github.workspace }}/spi-hal/include -I${{ github.workspace }}/libadxl345/include -I${{ github.workspace }}/i2c-hal/include -I${{ github.workspace }}/gpio/include"
          cmake --build build/test-integration -j$(nproc)
          mkdir -p test-results
          ./build/test-integration/integration_test_mcp3008 \
            --gtest_output=xml:test-results/integration.xml
          ./build/test-integration/integration_test_adxl345 \
            --gtest_output=xml:test-results/integration-adxl345.xml
          ./build/test-integration/integration_test_ads1115 \
            --gtest_output=xml:test-results/integration-ads1115.xml
          ./build/test-integration/integration_test_gpio \
            --gtest_output=xml:test-results/integration-gpio.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  # ── 統合テスト経路（issue #20 / #21）────────────────────────────────────
  # トップツリーから全コンポーネント + テストを一度に build し ctest で実行する。
  # include は in-tree target から伝播するため、従来の per-component な install +
  # スタンドアロン configure + -I 手渡し（落とし穴 #1/#2）が不要。フラグ定義は
  # CMakePresets.json に一元化し、ここでは preset 名を matrix で渡すだけにする。
  #
  # NOTE: 既存の build-and-test / coverage / sanitizer ジョブは当面そのまま残す
  # （install ベースの名前解決経路の検証としても価値があるため）。この統合経路が
  # 安定して green であることを確認できたら、各レガシージョブを preset 経由へ
  # 段階的に移行できる。
  integrated-tests:
    runs-on: ubuntu-24.04
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, coverage, asan, tsan]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make git libgtest-dev gcovr

      - name: GTest cache key
        id: gtest-key
        run: echo "ver=$(dpkg-query -W -f='${Version}' libgtest-dev)" >> "$GITHUB_OUTPUT"

      - name: Cache GTest build
        id: cache-gtest
        uses: actions/cache@v4
        with:
          path: /tmp/gtest-build
          key: gtest-${{ runner.os }}-${{ steps.gtest-key.outputs.ver }}

      - name: Build GTest from source
        if: steps.cache-gtest.outputs.cache-hit != 'true'
        run: |
          cmake -B /tmp/gtest-build /usr/src/googletest \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/gtest-build

      - name: Install GTest
        run: sudo cmake --install /tmp/gtest-build --prefix /usr/local

      - name: Configure / build / test (preset=${{ matrix.preset }})
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} -j$(nproc)
          ctest --preset ${{ matrix.preset }}

  coverage:
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make git libgtest-dev gcovr

      # GTest はソースからビルドして /usr/local に install する（落とし穴 #3）。
      # ビルド成果物 /tmp/gtest-build をキャッシュし、キャッシュヒット時は
      # ビルド（高コスト）を省略して install のみ実行する。
      # キャッシュキーは libgtest-dev のバージョンに紐付け、apt 側が更新されたら自動失効させる。
      - name: GTest cache key
        id: gtest-key
        run: echo "ver=$(dpkg-query -W -f='${Version}' libgtest-dev)" >> "$GITHUB_OUTPUT"

      - name: Cache GTest build
        id: cache-gtest
        uses: actions/cache@v4
        with:
          path: /tmp/gtest-build
          key: gtest-${{ runner.os }}-${{ steps.gtest-key.outputs.ver }}

      - name: Build GTest from source
        if: steps.cache-gtest.outputs.cache-hit != 'true'
        run: |
          cmake -B /tmp/gtest-build /usr/src/googletest \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/gtest-build

      - name: Install GTest
        run: sudo cmake --install /tmp/gtest-build --prefix /usr/local

      - name: Build spi-hal with coverage flags
        run: |
          cmake -S spi-hal -B build/spihal-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
          cmake --build build/spihal-cov -j$(nproc)
          sudo cmake --install build/spihal-cov --prefix /usr/local

      - name: Build libsensor with coverage flags
        run: |
          cmake -S libsensor -B build/libsensor-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
          cmake --build build/libsensor-cov -j$(nproc)
          sudo cmake --install build/libsensor-cov --prefix /usr/local
          sudo ldconfig

      - name: Build libadxl345 with coverage flags
        run: |
          cmake -S libadxl345 -B build/libadxl345-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
          cmake --build build/libadxl345-cov -j$(nproc)
          sudo cmake --install build/libadxl345-cov --prefix /usr/local
          sudo ldconfig

      - name: Build libmcp9808 with coverage flags
        run: |
          cmake -S libmcp9808 -B build/libmcp9808-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
          cmake --build build/libmcp9808-cov -j$(nproc)
          sudo cmake --install build/libmcp9808-cov --prefix /usr/local
          sudo ldconfig

      - name: Build i2c-hal with coverage flags
        run: |
          cmake -S i2c-hal -B build/i2chal-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
          cmake --build build/i2chal-cov -j$(nproc)
          sudo cmake --install build/i2chal-cov --prefix /usr/local

      - name: Build gpio with coverage flags
        run: |
          cmake -S gpio -B build/gpio-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
          cmake --build build/gpio-cov -j$(nproc)
          sudo cmake --install build/gpio-cov --prefix /usr/local

      - name: Run spi-hal tests (coverage)
        run: |
          # --coverage を付けずに静的ライブラリ libspihal.a (instrumented) と
          # リンクすると __gcov_merge_add 等が未解決になるため、
          # テスト側にも --coverage を渡す必要がある
          cmake -S tests/unit/spi-hal -B build/test-spihal-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -I${{ github.workspace }}/spi-hal/include" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build/test-spihal-cov -j$(nproc)
          mkdir -p test-results
          ./build/test-spihal-cov/test_spi_driver \
            --gtest_output=xml:test-results/spihal-unit.xml
          ./build/test-spihal-cov/test_kernel_spi_driver \
            --gtest_output=xml:test-results/spihal-kernel-unit.xml

      - name: Run libsensor tests (coverage)
        run: |
          # tests/unit/libsensor は test_ads1115 も含むため i2c-hal/include が必要
          cmake -S tests/unit/libsensor -B build/test-libsensor-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -I${{ github.workspace }}/libsensor/include -I${{ github.workspace }}/i2c-hal/include -I${{ github.workspace }}/tests/mocks" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build/test-libsensor-cov -j$(nproc)
          ./build/test-libsensor-cov/test_sensor \
            --gtest_output=xml:test-results/libsensor-unit.xml
          ./build/test-libsensor-cov/test_ads1115 \
            --gtest_output=xml:test-results/ads1115-unit.xml

      - name: Run libadxl345 tests (coverage)
        run: |
          cmake -S tests/unit/libadxl345 -B build/test-libadxl345-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -I${{ github.workspace }}/libadxl345/include -I${{ github.workspace }}/tests/mocks" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build/test-libadxl345-cov -j$(nproc)
          ./build/test-libadxl345-cov/test_adxl345 \
            --gtest_output=xml:test-results/libadxl345-unit.xml

      - name: Run libmcp9808 tests (coverage)
        run: |
          cmake -S tests/unit/libmcp9808 -B build/test-libmcp9808-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -I${{ github.workspace }}/libmcp9808/include -I${{ github.workspace }}/i2c-hal/include -I${{ github.workspace }}/tests/mocks" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build/test-libmcp9808-cov -j$(nproc)
          ./build/test-libmcp9808-cov/test_mcp9808 \
            --gtest_output=xml:test-results/libmcp9808-unit.xml

      - name: Run i2c-hal tests (coverage)
        run: |
          cmake -S tests/unit/i2c-hal -B build/test-i2chal-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -I${{ github.workspace }}/i2c-hal/include" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build/test-i2chal-cov -j$(nproc)
          ./build/test-i2chal-cov/test_i2c_driver \
            --gtest_output=xml:test-results/i2chal-unit.xml

      - name: Run gpio tests (coverage)
        run: |
          cmake -S tests/unit/gpio -B build/test-gpio-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -I${{ github.workspace }}/gpio/include" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build/test-gpio-cov -j$(nproc)
          ./build/test-gpio-cov/test_gpio_line \
            --gtest_output=xml:test-results/gpio-unit.xml

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          gcovr \
            --root . \
            --exclude 'tests/' \
            --exclude '/usr/' \
            --html-details coverage/index.html \
            --xml coverage/cobertura.xml \
            --print-summary

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Upload coverage test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-results
          path: test-results/

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck and clang-tidy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck clang-tidy cmake

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --std=c++17 \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            spi-hal/src/ i2c-hal/src/ gpio/src/ libsensor/src/ libadxl345/src/ libmcp9808/src/ cli/src/ examples/

      - name: Run clang-tidy
        run: |
          # チェック内容は .clang-tidy を単一の情報源とする（コマンドラインで
          # --checks を指定すると .clang-tidy が上書きされ、ローカルと CI で
          # 適用チェックが食い違う）。対象ファイルは cppcheck（ディレクトリ指定）
          # と揃え、kernel_spi_driver.cpp と examples/ も含める。
          cmake -B build-tidy -S . \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Debug
          clang-tidy \
            -p build-tidy/ \
            spi-hal/src/spi_driver.cpp \
            spi-hal/src/kernel_spi_driver.cpp \
            i2c-hal/src/i2c_driver.cpp \
            gpio/src/gpio_line.cpp \
            libsensor/src/sensor.cpp \
            libsensor/src/ads1115.cpp \
            libadxl345/src/adxl345.cpp \
            libmcp9808/src/mcp9808.cpp \
            cli/src/main.cpp \
            examples/ads1115_alert_demo.cpp

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GitHub の mermaid はクライアント側描画のため構文エラーが検知されない。
      # 全 *.md の mermaid ブロックを Docker(mmdc) で検証する（ローカル pre-push と共通スクリプト）。
      - name: Validate mermaid diagrams
        run: bash tools/check-mermaid.sh

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Generate Doxygen docs
        run: |
          mkdir -p docs/doxygen
          doxygen Doxyfile

      - name: Upload HTML docs
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/doxygen/html/

  # ============================================================
  # コミットメッセージ形式チェック（PR 時のみ実行）
  # CONTRIBUTING.md の規約: feat|fix|docs|refactor|test|ci|chore
  # ============================================================
  commit-lint:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title format
        env:
          # 信頼できない入力は env 経由で渡す（run スクリプトへ直接展開すると
          # シェルインジェクションになる。GitHub 公式の推奨パターン）。
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|refactor|test|ci|chore|build)(\(.+\))?!?: .+'
          if echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "OK: $TITLE"
          else
            echo "ERROR: PR タイトルが Conventional Commits 形式に合っていません"
            echo "  受け取った値: $TITLE"
            echo "  期待する形式: feat|fix|docs|refactor|test|ci|chore|build: <概要>"
            echo "  例: feat(libsensor): read_raw_async にタイムアウトを追加"
            exit 1
          fi

      - name: Validate commit messages in PR
        run: |
          PATTERN='^(feat|fix|docs|refactor|test|ci|chore|build)(\(.+\))?!?: .+'
          INVALID=0
          while IFS= read -r msg; do
            # マージコミットはスキップ
            echo "$msg" | grep -qE '^Merge ' && continue
            if ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "INVALID: $msg"
              INVALID=1
            fi
          done < <(git log origin/main..HEAD --format="%s")
          if [ "$INVALID" -eq 1 ]; then
            echo ""
            echo "ERROR: Conventional Commits 形式に合わないコミットがあります"
            echo "CONTRIBUTING.md を参照してください"
            exit 1
          fi
          echo "All commit messages are valid."

  # ============================================================
  # サニタイザーテスト（build-and-test 後に実行）
  # ASAN+UBSAN と TSAN は同時使用不可 → 別ビルドディレクトリで実行
  # ============================================================
  sanitizer:
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make git libgtest-dev

      # GTest はソースからビルドして /usr/local に install する（落とし穴 #3）。
      # ビルド成果物 /tmp/gtest-build をキャッシュし、キャッシュヒット時は
      # ビルド（高コスト）を省略して install のみ実行する。
      # キャッシュキーは libgtest-dev のバージョンに紐付け、apt 側が更新されたら自動失効させる。
      - name: GTest cache key
        id: gtest-key
        run: echo "ver=$(dpkg-query -W -f='${Version}' libgtest-dev)" >> "$GITHUB_OUTPUT"

      - name: Cache GTest build
        id: cache-gtest
        uses: actions/cache@v4
        with:
          path: /tmp/gtest-build
          key: gtest-${{ runner.os }}-${{ steps.gtest-key.outputs.ver }}

      - name: Build GTest from source
        if: steps.cache-gtest.outputs.cache-hit != 'true'
        run: |
          cmake -B /tmp/gtest-build /usr/src/googletest \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/gtest-build

      - name: Install GTest
        run: sudo cmake --install /tmp/gtest-build --prefix /usr/local

      # ── ASAN + UBSAN ──────────────────────────────────────────
      - name: Build spi-hal + libsensor with ASAN+UBSAN
        run: |
          cmake -S spi-hal -B build/spihal-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/spihal-asan -j$(nproc)
          sudo cmake --install build/spihal-asan --prefix /usr/local
          cmake -S libsensor -B build/libsensor-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/libsensor-asan -j$(nproc)
          sudo cmake --install build/libsensor-asan --prefix /usr/local
          cmake -S libadxl345 -B build/libadxl345-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/libadxl345-asan -j$(nproc)
          sudo cmake --install build/libadxl345-asan --prefix /usr/local
          sudo ldconfig

      - name: Build i2c-hal + gpio with ASAN+UBSAN
        run: |
          cmake -S i2c-hal -B build/i2chal-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/i2chal-asan -j$(nproc)
          sudo cmake --install build/i2chal-asan --prefix /usr/local
          cmake -S gpio -B build/gpio-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/gpio-asan -j$(nproc)
          sudo cmake --install build/gpio-asan --prefix /usr/local
          # libmcp9808 は i2c-hal にリンクするため、i2c-hal install 後にビルドする
          cmake -S libmcp9808 -B build/libmcp9808-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/libmcp9808-asan -j$(nproc)
          sudo cmake --install build/libmcp9808-asan --prefix /usr/local
          sudo ldconfig

      - name: SPI HAL unit tests (ASAN+UBSAN)
        run: |
          cmake -S tests/unit/spi-hal -B build/test-spihal-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer \
              -I${{ github.workspace }}/spi-hal/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/test-spihal-asan -j$(nproc)
          mkdir -p test-results
          ASAN_OPTIONS=detect_leaks=1 \
          ./build/test-spihal-asan/test_spi_driver \
            --gtest_output=xml:test-results/spihal-asan.xml
          ASAN_OPTIONS=detect_leaks=1 \
          ./build/test-spihal-asan/test_kernel_spi_driver \
            --gtest_output=xml:test-results/spihal-kernel-asan.xml

      - name: Libsensor unit tests (ASAN+UBSAN)
        run: |
          cmake -S tests/unit/libsensor -B build/test-libsensor-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer \
              -I${{ github.workspace }}/libsensor/include \
              -I${{ github.workspace }}/i2c-hal/include \
              -I${{ github.workspace }}/tests/mocks" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/test-libsensor-asan -j$(nproc)
          ASAN_OPTIONS=detect_leaks=1 \
          ./build/test-libsensor-asan/test_sensor \
            --gtest_output=xml:test-results/libsensor-asan.xml
          ASAN_OPTIONS=detect_leaks=1 \
          ./build/test-libsensor-asan/test_ads1115 \
            --gtest_output=xml:test-results/ads1115-asan.xml

      - name: Libadxl345 unit tests (ASAN+UBSAN)
        run: |
          cmake -S tests/unit/libadxl345 -B build/test-libadxl345-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer \
              -I${{ github.workspace }}/libadxl345/include \
              -I${{ github.workspace }}/tests/mocks" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/test-libadxl345-asan -j$(nproc)
          ASAN_OPTIONS=detect_leaks=1 \
          ./build/test-libadxl345-asan/test_adxl345 \
            --gtest_output=xml:test-results/libadxl345-asan.xml

      - name: Libmcp9808 unit tests (ASAN+UBSAN)
        run: |
          cmake -S tests/unit/libmcp9808 -B build/test-libmcp9808-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer \
              -I${{ github.workspace }}/libmcp9808/include \
              -I${{ github.workspace }}/i2c-hal/include \
              -I${{ github.workspace }}/tests/mocks" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/test-libmcp9808-asan -j$(nproc)
          ASAN_OPTIONS=detect_leaks=1 \
          ./build/test-libmcp9808-asan/test_mcp9808 \
            --gtest_output=xml:test-results/libmcp9808-asan.xml

      - name: I2C HAL unit tests (ASAN+UBSAN)
        run: |
          cmake -S tests/unit/i2c-hal -B build/test-i2chal-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer \
              -I${{ github.workspace }}/i2c-hal/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/test-i2chal-asan -j$(nproc)
          ASAN_OPTIONS=detect_leaks=1 \
          ./build/test-i2chal-asan/test_i2c_driver \
            --gtest_output=xml:test-results/i2chal-asan.xml

      - name: GPIO unit tests (ASAN+UBSAN)
        run: |
          cmake -S tests/unit/gpio -B build/test-gpio-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer \
              -I${{ github.workspace }}/gpio/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/test-gpio-asan -j$(nproc)
          ASAN_OPTIONS=detect_leaks=1 \
          ./build/test-gpio-asan/test_gpio_line \
            --gtest_output=xml:test-results/gpio-asan.xml

      # ── TSAN ─────────────────────────────────────────────────
      - name: Build libsensor with TSAN
        run: |
          cmake -S spi-hal -B build/spihal-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/spihal-tsan -j$(nproc)
          sudo cmake --install build/spihal-tsan --prefix /usr/local
          cmake -S libsensor -B build/libsensor-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/libsensor-tsan -j$(nproc)
          sudo cmake --install build/libsensor-tsan --prefix /usr/local
          sudo ldconfig

      - name: Libsensor unit tests (TSAN) — read_raw_async スレッド検査
        run: |
          cmake -S tests/unit/libsensor -B build/test-libsensor-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer \
              -I${{ github.workspace }}/libsensor/include \
              -I${{ github.workspace }}/i2c-hal/include \
              -I${{ github.workspace }}/tests/mocks" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build/test-libsensor-tsan -j$(nproc)
          TSAN_OPTIONS=halt_on_error=1 \
          ./build/test-libsensor-tsan/test_sensor \
            --gtest_output=xml:test-results/libsensor-tsan.xml

      - name: Upload sanitizer test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-test-results
          path: test-results/
