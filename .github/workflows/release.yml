name: Release

# spi-hal/v*, i2c-hal/v*, gpio/v*, libsensor/v*, libadxl345/v*, libmcp9808/v*, cli/v* のいずれかのタグが push されたときに実行
on:
  push:
    tags:
      - 'spi-hal/v*'
      - 'i2c-hal/v*'
      - 'gpio/v*'
      - 'libsensor/v*'
      - 'libadxl345/v*'
      - 'libmcp9808/v*'
      - 'cli/v*'

# CHANGELOG.md の commit push と GitHub Release 作成に書き込み権限が必要
permissions:
  contents: write

jobs:
  changelog-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git-cliff が全コミット履歴を必要とするため

      # タグ push のチェックアウトはタグコミットに detached している。後で main へ
      # コミット/push するため、先に main を明示チェックアウトする（detached のまま
      # push origin HEAD:main すると、タグ後に main が進んでいると non-fast-forward で
      # 失敗する）。git-cliff は git 履歴全体を読むため、どのブランチにいても全タグを
      # 認識できる。
      - name: Check out main
        run: |
          git fetch origin main
          git checkout main

      # git-cliff でコミット履歴から CHANGELOG.md を生成（main の tip 基準）
      # orhun/git-cliff-action はシングルバイナリをダウンロードするため Rust 不要
      - name: Generate CHANGELOG with git-cliff
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      # 当該リリース分だけのリリースノートを生成（CHANGELOG.md 全体ではなく最新タグ分）
      - name: Generate release notes (latest only)
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      # 生成した CHANGELOG.md を main ブランチにコミット
      - name: Commit CHANGELOG.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # 変更がある場合のみコミット（初回タグ以外は差分あり）。
          # [skip ci] で CHANGELOG コミットによる CI 再走を防ぐ。
          git diff --cached --quiet || \
            git commit -m "chore: update CHANGELOG.md for ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:main

      # GitHub Release を作成し、当該リリース分のノートをリリース本文として使用
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
