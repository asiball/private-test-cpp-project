name: Release

# spi-hal/v*, i2c-hal/v*, gpio/v*, libsensor/v*, libadxl345/v*, cli/v* のいずれかのタグが push されたときに実行
on:
  push:
    tags:
      - 'spi-hal/v*'
      - 'i2c-hal/v*'
      - 'gpio/v*'
      - 'libsensor/v*'
      - 'libadxl345/v*'
      - 'cli/v*'

# CHANGELOG.md の commit push と GitHub Release 作成に書き込み権限が必要
permissions:
  contents: write

jobs:
  changelog-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git-cliff が全コミット履歴を必要とするため

      # git-cliff でコミット履歴から CHANGELOG.md を生成
      # orhun/git-cliff-action はシングルバイナリをダウンロードするため Rust 不要
      - name: Generate CHANGELOG with git-cliff
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      # 生成した CHANGELOG.md を main ブランチにコミット
      # タグは detached HEAD になるため main を明示 checkout してから push する
      - name: Commit CHANGELOG.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          # git-cliff が CHANGELOG.md を生成した結果をステージングして main へ push
          git add CHANGELOG.md
          # 変更がある場合のみコミット（初回タグ以外は差分あり）
          git diff --cached --quiet || \
            git commit -m "chore: update CHANGELOG.md for ${{ github.ref_name }} [skip ci]"
          git push origin HEAD:main

      # 最新リリース分の CHANGELOG のみ抽出してリリースノートにする
      - name: Generate latest release notes
        run: |
          pip install git-cliff --quiet 2>/dev/null || true
          git cliff --latest --output RELEASE_NOTES.md || cp CHANGELOG.md RELEASE_NOTES.md

      # GitHub Release を作成し、最新リリース分のノートを使用
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
